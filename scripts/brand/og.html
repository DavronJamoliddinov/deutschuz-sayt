<!doctype html>
<!-- Open Graph rasmi (1200×630) uchun shablon. Qayta yaratish: README.md → «Brend rasmlari». -->
<html lang="uz">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Onest"; src: url("../../src/app/fonts/onest-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Inter"; src: url("../../src/app/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../../src/app/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #101a35; color: #f8f8f5; font-family: Inter, sans-serif; position: relative;
    background-image:
      radial-gradient(60% 70% at 85% 30%, rgba(255, 212, 71, 0.16), transparent 60%),
      radial-gradient(50% 60% at 70% 110%, rgba(240, 100, 85, 0.18), transparent 60%),
      radial-gradient(70% 80% at 0% 0%, #1d2f5c, transparent 60%);
  }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse 80% 80% at 40% 40%, #000 30%, transparent 75%); }
  .wrap { position: relative; display: flex; height: 100%; padding: 64px 72px; gap: 40px; align-items: center; }
  .left { flex: 1.25; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: Onest; font-weight: 600; font-size: 30px; letter-spacing: -0.03em; }
  .brand b { color: #ffd447; font-weight: 600; }
  h1 { margin-top: 40px; font-family: Onest; font-weight: 600; font-size: 74px; line-height: 1.02; letter-spacing: -0.045em; }
  h1 em { font-style: normal; color: #ffd447; }
  p { margin-top: 26px; font-size: 25px; color: rgba(248,248,245,.72); letter-spacing: -0.01em; }
  .right { flex: 0.75; display: flex; flex-direction: column; gap: 18px; }
  .card { background: #fff; color: #151b2e; border-radius: 26px; padding: 26px 28px; box-shadow: 0 30px 60px -20px rgba(3,7,18,.6); }
  .card .art { font-size: 22px; font-weight: 600; color: #d13438; }
  .card .word { font-family: "Instrument Serif"; font-style: italic; font-size: 64px; line-height: 1; }
  .card .uz { margin-top: 10px; font-family: Onest; font-weight: 600; font-size: 34px; letter-spacing: -0.03em; }
  .card .ex { margin-top: 16px; background: #f1f0ea; border-radius: 14px; padding: 12px 14px; font-size: 17px; }
  .card .ex span { display: block; color: #6b7285; font-size: 16px; }
  .chips { display: flex; gap: 10px; }
  .chip { flex: 1; text-align: center; border-radius: 14px; padding: 12px 0; font-weight: 600; font-size: 21px; background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14); }
  .chip.der { background: #1d5fd6; border-color: #1d5fd6; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <img src="../../assets/brand/deutschuz-logo-mark-512.png" width="60" height="60" alt="">

        <span>Deutsch<b>Uz</b></span>
      </div>
      <h1>Nemis tilini <em>oʻzbekcha</em> tushunib oʻrganing.</h1>
      <p>Lugʻat · Grammatika · Kartochkalar · AI bilan gapirish</p>
    </div>
    <div class="right">
      <div class="card">
        <div class="art">die</div>
        <div class="word">Sprache</div>
        <div class="uz">til</div>
        <div class="ex">Ich lerne eine neue Sprache.<span>Men yangi til oʻrganyapman.</span></div>
      </div>
      <div class="chips"><div class="chip der">der ✓</div><div class="chip">die</div><div class="chip">das</div></div>
    </div>
  </div>
</body>
</html>
